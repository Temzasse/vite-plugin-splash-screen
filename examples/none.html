<script>
  (function () {
    const defaultScheme = 'dark';
    const persistKey = '';
    const adaptive = true;
    const variables = {"light":{"--vpss-bg-splash":"#ffffff","--vpss-bg-loader":"#b18500"},"dark":{"--vpss-bg-splash":"#1b1b1a","--vpss-bg-loader":"#ffcb29"}};

    function updateColorScheme(colorScheme) {
      window.COLOR_SCHEME = colorScheme;

      const root = document.documentElement;

      root.style.setProperty('color-scheme', colorScheme);

      const scheme = variables[colorScheme];

      for (const [key, value] of Object.entries(scheme)) {
        root.style.setProperty(key, value);
      }
    }

    function getColorScheme() {
      let persisted = null;

      if (persistKey) {
        try {
          persisted = JSON.parse(window.localStorage.getItem(persistKey));
        } catch (error) {}
      }

      const hasPersistedPreference =
        typeof persisted === 'string' &&
        ['light', 'dark'].indexOf(persisted) !== -1;

      if (hasPersistedPreference) {
        return persisted;
      }

      const mql = window.matchMedia('(prefers-color-scheme: dark)');
      const hasMediaQueryPreference = typeof mql.matches === 'boolean';

      if (hasMediaQueryPreference) {
        return mql.matches ? 'dark' : 'light';
      }

      return defaultScheme;
    }

    // Get and update initial color scheme
    const colorScheme = getColorScheme();

    updateColorScheme(colorScheme);

    // Id adaptive is enabled, listen for changes
    if (adaptive) {
      window
        .matchMedia("(prefers-color-scheme: dark)")
        .addEventListener("change", (e) => {
          updateColorScheme(e.matches ? "dark" : "light");
        });
    }
  })();

@media (prefers-reduced-motion: reduce) {
  #vpss .vpss-loader {
    animation: vpss-pulse 2s ease-in-out infinite;
  }
  #vpss .vpss-loader * {
    animation: none !important;
  }
}
