<!-- Example animated HTML logo. All CSS is scoped under #example-logo because
an inlined <style> applies to the whole page. -->
<div id="example-logo">
  <style>
    #example-logo {
      font:
        700 40px/1 system-ui,
        sans-serif;
      letter-spacing: 0.04em;
      color: var(--vpss-bg-loader, #0072f5);
    }
    #example-logo span {
      display: inline-block;
      opacity: 0;
      animation: example-logo-in 600ms ease-out forwards;
    }
    #example-logo span:nth-child(2) {
      animation-delay: 150ms;
    }
    #example-logo span:nth-child(3) {
      animation-delay: 300ms;
    }
    #example-logo span:nth-child(4) {
      animation-delay: 450ms;
    }

    /* One-shot exit animation, waited for with `waitForAnimations: true` */
    #vpss[data-vpss-state='hiding'] #example-logo {
      animation: example-logo-out 500ms ease-in forwards;
    }

    @keyframes example-logo-in {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }
    @keyframes example-logo-out {
      to {
        opacity: 0;
        transform: scale(1.15);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #example-logo span,
      #vpss[data-vpss-state='hiding'] #example-logo {
        animation: none;
        opacity: 1;
      }
    }
  </style>
  <span>V</span><span>P</span><span>S</span><span>S</span>
</div>
